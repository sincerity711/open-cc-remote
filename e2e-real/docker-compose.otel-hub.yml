# Compose override applied (in addition to docker-compose.yml + .demo.yml)
# when WITH_OTEL=1 in tools/demo-channel.sh and the OTel e2e test. Plumbs
# the in-container hub to the host-published Jaeger collector so its OTLP
# exporter can reach :4318 (host.docker.internal works on Mac/Win Docker
# Desktop and via the extra_hosts entry for Linux).

services:
  hub:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://host.docker.internal:4318"
      OTEL_SERVICE_NAME: "hub"
