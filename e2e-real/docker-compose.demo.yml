version: "3.9"
# Demo override: high-port mapping + a host URL reachable from BOTH the
# hub container AND host-side browsers.
#
# We use ${HOST_IP} (the Mac's LAN IP, set by tools/demo-channel.sh before
# `docker compose up`). From inside hub: container's NAT can reach the host
# at this IP, port 17770 is mapped to fake-ias. From the browser: same IP
# resolves to the Mac itself, same port mapping. host.docker.internal does
# NOT work for this purpose — Docker Desktop only adds it inside containers,
# the host's resolver has it but routes to a non-reachable Docker bridge IP.
#
# !override is required because docker-compose merges the `ports` list
# by APPENDING entries; without override the base low-port bindings stay.
services:
  fake-ias:
    ports: !override
      - "17770:7770"
  hub:
    ports: !override
      - "17745:7745"
    environment:
      HUB_PWA_URL: "http://localhost:15173/"
      HUB_IAS_ISSUER: "http://${HOST_IP}:17770"
      HUB_IAS_REDIRECT_URI: "http://localhost:17745/auth/callback"
