version: "3.9"
# Demo override: high-port mapping + IAS issuer URL controlled by the
# demo-channel.sh ISSUER_HOST env (auto-detected: LAN IP if reachable, else
# `cc-ias-demo` requiring /etc/hosts entry).
#
# !override is required because docker-compose merges the `ports` list by
# APPENDING entries; without override the base low-port bindings would stay.
services:
  fake-ias:
    ports: !override
      - "17770:7770"
    environment:
      # Demo-side issuer + redirects must match what the demo hub sends and
      # what the host browser can reach. Base compose uses the e2e ports.
      FAKE_IAS_ISSUER: "http://${ISSUER_HOST}:17770"
      FAKE_IAS_REDIRECT_URIS: "http://localhost:17745/auth/callback"
  hub:
    ports: !override
      - "17745:7745"
    extra_hosts:
      # Only used in the cc-ias-demo fallback path. host-gateway resolves to
      # the host machine, where 17770 is published from fake-ias.
      - "cc-ias-demo:host-gateway"
    environment:
      HUB_PWA_URL: "http://localhost:15173/"
      HUB_IAS_ISSUER: "http://${ISSUER_HOST}:17770"
      HUB_IAS_REDIRECT_URI: "http://localhost:17745/auth/callback"
