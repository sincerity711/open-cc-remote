# Jaeger all-in-one for trace validation. Used by the OTel e2e test
# (e2e-real/tests/30-otel-trace.test.ts) and can be brought up alongside
# the demo via `tools/demo-channel.sh --otel` for ad-hoc inspection.
#
# Single container, OTLP HTTP receiver on :4318, query API + UI on
# :16686. No persistence — `restart: "no"` and an in-memory backend keep
# every run clean.

services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # Allow the PWA (running at localhost:4173 in the e2e harness, or
      # localhost:15173 in the demo) to POST OTLP spans from the browser.
      # Wildcard since this is local dev infra only.
      COLLECTOR_OTLP_HTTP_CORS_ALLOWED_ORIGINS: "http://localhost:4173,http://localhost:15173"
      COLLECTOR_OTLP_HTTP_CORS_ALLOWED_HEADERS: "*"
    ports:
      - "16686:16686"   # UI + Query API
      - "4318:4318"     # OTLP HTTP
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:14269/ || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
